name: edutrack_app
description: EduTrack - Smart Attendance Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase - Backend
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # QR Code (display on student profile)
  qr_flutter: ^4.1.0

  # QR Scanner (built-in attendance — replaces separate Scanner App)
  mobile_scanner: ^5.2.3

  # Image picker (for profile photos, videos)
  image_picker: ^1.1.2

  # File handling (for PDF reports)
  open_filex: ^4.3.4
  dio: ^5.4.3+1

  # Icons
  cupertino_icons: ^1.0.6
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/EduTrack.png"
  min_sdk_android: 21